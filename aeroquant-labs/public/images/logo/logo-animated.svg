<svg xmlns="http://www.w3.org/2000/svg" width="168" height="168" viewBox="0 0 168 168" role="img" aria-label="AeroQuant Labs logo">
  <defs>
    <clipPath id="logoClip"><circle cx="84" cy="84" r="76"/></clipPath>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b93ff" stop-opacity="0"/>
      <stop offset="65%" stop-color="#2b93ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="scale" values="0.72;1.07;1" keyTimes="0;0.62;1" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.25 0.8 0.4 1" dur="0.9s" fill="freeze"/>
    <g clip-path="url(#logoClip)">
      <image href="data:image/jpeg;base64," x="8" y="8" width="152" height="152"/>
    </g>
    <circle cx="84" cy="84" r="80" fill="none" stroke="url(#comet)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="74 429">
      <animateTransform attributeName="transform" type="rotate" from="0 84 84" to="360 84 84" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>